[package]
name = "app"
description = "Claude Multi Auth menubar app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "claude-multi-auth"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
cma-core.workspace = true
# The `cma` command layer, run in-process (`cma::embed`), so the app takes
# the same lock → recover → sync path, validation and error codes as the CLI.
cma = { path = "../../crates/cli" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
# Exclusive / swapping rename for Install CLI (already in the tree).
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
# The fake backend (temp HOME, file-backed Keychain, fake Claude Desktop)
# for tests that run cma commands through the app's consent handling.
cma = { path = "../../crates/cli", features = ["test-backends"] }
tempfile.workspace = true

[lints]
workspace = true
